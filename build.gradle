buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // JitPack: dibutuhkan untuk cz.adaptech:tesseract4android (OCR
        // Arabic) — library ini tidak dipublikasikan di Maven Central.
        maven { url 'https://jitpack.io' }
    }
}
