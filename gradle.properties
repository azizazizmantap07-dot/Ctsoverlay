org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Toleransi jaringan lebih tinggi + retry otomatis saat resolve dependency
# dari Maven Central / Google Maven. Membantu saat repo remote sedang
# rate-limit (HTTP 429) atau koneksi CI runner sedang lambat, supaya
# Gradle mencoba lagi beberapa kali sebelum benar-benar gagal.
systemProp.http.socketTimeout=60000
systemProp.http.connectionTimeout=60000
systemProp.https.socketTimeout=60000
systemProp.https.connectionTimeout=60000
org.gradle.internal.repository.max.retries=5
org.gradle.internal.repository.initial.backoff=500
