name: Build Signed Release APK

# Workflow ini terpisah dari build.yml (debug) karena butuh secret keystore.
# Jalankan manual lewat tab Actions > Build Signed Release APK > Run workflow,
# setelah secret berikut disetel di Settings > Secrets and variables > Actions:
#   ANDROID_KEYSTORE_BASE64   -> hasil `base64 -w0 keystore.jks`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Jika secret belum disetel, jalankan build.yml (APK debug) saja terlebih dulu.

on:
  workflow_dispatch: {}

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 belum disetel. Batalkan build release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$(pwd)/release.keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Clean up keystore file
        if: always()
        run: rm -f release.keystore.jks

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleSearchOverlay-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
