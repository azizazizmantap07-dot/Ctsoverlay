name: Build Signed Release APK

# Manual trigger saja — butuh secrets keystore di Settings → Secrets.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 belum diisi — skip signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        run: >
          ./gradlew assembleRelease --stacktrace
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore.jks
          -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }}
          -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: CircleSearchOverlay-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
