name: Build Signed Release APK

on:
  workflow_dispatch:          # manual: tab Actions -> Run workflow
  push:
    tags:
      - 'v*'                  # otomatis saat push tag, mis. v1.9.7

permissions:
  contents: write             # perlu untuk upload ke GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore.jks"

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"

      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          cp app/build/outputs/apk/release/*.apk "CircleSearchOverlay-v${VER}-release.apk"
          echo "APK_NAME=CircleSearchOverlay-v${VER}-release.apk" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleSearchOverlay-release-apk
          path: ${{ env.APK_NAME }}

      - name: Attach to GitHub Release (hanya jika trigger dari tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
