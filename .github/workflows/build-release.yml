name: Build Signed Release APK

on:
  workflow_dispatch:          # manual: tab Actions -> Run workflow
  push:
    tags:
      - 'v*'                  # otomatis saat push tag, mis. v1.9.7

permissions:
  contents: write             # perlu untuk upload ke GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore.jks"

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          for APK in app/build/outputs/apk/release/*.apk; do
            echo "APK: $APK"
            "$BT/apksigner" verify --verbose --print-certs "$APK"
          done

      - name: Rename APKs
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          mkdir -p release-out
          for APK in app/build/outputs/apk/release/*.apk; do
            BASENAME=$(basename "$APK")
            # nama file mentah AGP: app-arm64-v8a-release.apk / app-armeabi-v7a-release.apk / app-universal-release.apk
            VARIANT=$(echo "$BASENAME" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$APK" "release-out/CircleSearchOverlay-v${VER}-${VARIANT}.apk"
          done
          ls -la release-out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleSearchOverlay-release-apk
          path: release-out/*.apk

      - name: Attach to GitHub Release (hanya jika trigger dari tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*.apk
          generate_release_notes: true
